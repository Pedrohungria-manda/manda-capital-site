<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B2550">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Reembolso</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --az:#0B63B1; --azesc:#0B2550; --azesc2:#0F2E61; --verde:#3FB6AE; --ouro:#F3BC49;
  --creme:#F3EBD9; --tinta:#1D2433; --mudo:#5D6576; --linha:#E2E6EC; --fundo:#F4F6FA; --branco:#fff;
  /* semânticos: só significam estado, nunca acento */
  --ok:#1E8E5A; --atencao:#B7791F; --crit:#B4232A; --crit-bg:#FBE6E4; --ok-bg:#E3F4EB;
  --f-corpo:'Barlow',system-ui,sans-serif; --f-marca:'Montserrat','Barlow',sans-serif; --f-mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-corpo);color:var(--tinta);background:var(--fundo);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- capa ---------- */
#gate{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--azesc)}
.gcx{width:100%;max-width:400px;background:var(--branco);border-radius:14px;padding:32px 28px;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.marca{font-family:var(--f-marca);font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--az)}
.gcx h1{margin:6px 0 4px;font-size:26px;font-weight:700;color:var(--azesc)}
.gcx p.sub{margin:0 0 22px;color:var(--mudo);font-size:15px}
.campo{display:block;margin-bottom:14px}
.campo>span{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mudo);margin-bottom:5px}
.campo input,.campo textarea,.campo select{width:100%;padding:12px 13px;border:1px solid var(--linha);border-radius:8px;background:var(--branco);font-size:16px}
.campo input:focus,.bt:focus-visible,.it:focus-visible,.lk:focus-visible{outline:2px solid var(--az);outline-offset:1px}
.bt{font-family:var(--f-marca);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:var(--az);color:#fff;border:0;border-radius:8px;padding:13px 20px;cursor:pointer;min-height:44px}
.bt:disabled{opacity:.6;cursor:default}
.bt.cl{background:transparent;color:var(--az);border:1px solid var(--az)}
#gbtn{width:100%;margin-top:4px}
.lk{background:none;border:0;color:var(--az);cursor:pointer;padding:12px 0 0;font-size:14px;text-decoration:underline}
.err{color:var(--crit);font-size:14px;min-height:20px;margin:10px 0 0}
.msg{font-size:14px;margin-left:12px}.msg.ok{color:var(--ok)}.msg.er{color:var(--crit)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.col{min-width:0}
#sb{background:var(--azesc);color:var(--creme);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s}
#sb .topo{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 14px}
#sb .logo{font-family:var(--f-marca);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#fff}
#sb .logo small{display:block;font-family:var(--f-mono);font-weight:400;letter-spacing:.06em;text-transform:none;color:#9FB2D4;font-size:11px;margin-top:3px}
#sb-nav{flex:1;overflow:auto;padding:6px 10px}
.grp{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7F95BD;padding:16px 10px 6px}
.it{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--creme);padding:11px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:15px;font-weight:500;min-height:44px}
.it:hover{background:var(--azesc2)}
.it.on{background:var(--azesc2);box-shadow:inset 3px 0 0 var(--ouro);color:#fff}
#sb .pe{border-top:1px solid #163A73;padding:10px}
#sb.min{width:64px}#app.min{grid-template-columns:64px minmax(0,1fr)}
#sb.min .lb,#sb.min .grp,#sb.min .logo{display:none}
#tg{background:none;border:0;color:#9FB2D4;cursor:pointer;padding:6px;border-radius:6px}
header.bar{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--branco);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:5}
header.bar h2{margin:0;font-size:20px;font-weight:700;color:var(--azesc);flex:1}
#top-menu{display:none;background:none;border:0;padding:8px;margin-left:-8px;cursor:pointer;color:var(--azesc)}
.quem{font-size:14px;color:var(--mudo);text-align:right}.quem b{display:block;color:var(--tinta);font-weight:600}
main{padding:28px;max-width:1200px;width:100%}
.cx{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:22px 24px;margin-bottom:18px}
.cx h3{margin:0 0 4px;font-size:18px;color:var(--azesc)}
.cx p.sub{margin:0 0 14px;color:var(--mudo);font-size:15px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--creme);color:var(--azesc)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#rodape{padding:10px 28px 24px;color:var(--mudo);font-family:var(--f-mono);font-size:12px}
#rodape .aviso{color:var(--atencao)}
#veu{position:fixed;inset:0;background:rgba(11,37,80,.5);z-index:9}

.chip{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:99px;margin:2px 4px 2px 0;background:#FBF1DC;color:var(--atencao)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.tb select{padding:10px 12px;border:1px solid var(--linha);border-radius:8px;background:#fff;min-height:44px}
.tb .gap{flex:1}
.pl{display:grid;gap:10px}
.pl button.pi{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;width:100%;background:var(--branco);border:1px solid var(--linha);border-radius:10px;padding:12px 16px;cursor:pointer}
.pl button.pi:hover,.pl button.pi.on{border-color:var(--az)}
.pl .nm{font-weight:600;color:var(--azesc)}.pl .nm small{font-weight:400;color:var(--mudo)}
.pl .pc{grid-column:1/-1}
.tw{overflow-x:auto;border:1px solid var(--linha);border-radius:10px;background:var(--branco)}
table.tb2{border-collapse:collapse;width:100%;min-width:760px;font-size:14.5px}
.tb2 th{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mudo);text-align:left;padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tb2 td{padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tb2 tr:last-child td{border-bottom:0}
.tb2 .n{text-align:right}.tb2 tfoot td{font-weight:700;background:var(--fundo)}
.resumo{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:14px}.resumo b{display:block;font-size:22px;color:var(--azesc)}
.resumo span{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mudo)}
.conv{background:var(--creme);border-radius:10px;padding:14px 16px;margin-top:14px}.conv .cod{font-family:var(--f-mono);font-size:22px;letter-spacing:.12em}
.tgl{display:flex;gap:8px;align-items:center;margin:4px 0 14px}.tgl input{width:20px;height:20px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.tile{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:16px 18px}
.tile span{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mudo)}
.tile b{display:block;font-size:26px;color:var(--azesc);margin:4px 0 2px;font-weight:700}
.tile small{color:var(--mudo);font-size:13px}
.tile.at{border-color:var(--atencao)}.tile.at b{color:var(--atencao)}
.barras{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end}
.mes{text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--mudo)}
.par{height:170px;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--linha)}
.par i{display:block;width:42%;max-width:22px;border-radius:3px 3px 0 0;min-height:1px}
.par .f{background:var(--azesc)}.par .r{background:#8DB4DB}
.leg{display:flex;gap:18px;font-size:13px;color:var(--mudo);margin-top:12px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.causa{border-top:1px solid var(--linha);padding:12px 0}.causa:first-of-type{border-top:0}
.causa summary{cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 14px;list-style:none;min-height:44px;align-content:center}
.causa summary::-webkit-details-marker{display:none}
.causa .ct{font-weight:600;color:var(--azesc)}.causa .cv{font-weight:700;text-align:right}
.causa .cd{grid-column:1/-1;color:var(--mudo);font-size:14px}
.causa ul{margin:8px 0 0;padding:0;list-style:none;font-size:14.5px}.causa li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--linha)}
.ban{border-left:4px solid var(--atencao);background:#FBF1DC;border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:15px}
.ban.crit{border-color:var(--crit);background:var(--crit-bg)}.ban.ok{border-color:var(--ok);background:var(--ok-bg)}
.gc{min-width:104px}.gc b{font-weight:600}.gc small{display:block;color:var(--mudo);font-size:12px}
.bar{height:8px;background:var(--linha);border-radius:4px;overflow:hidden;margin:4px 0 2px}.bar i{display:block;height:100%}
.n-ok .bar i{background:var(--ok)}.n-atencao .bar i{background:var(--atencao)}.n-critico .bar i{background:var(--crit)}
.n-atencao small b{color:var(--atencao)}.n-critico small b{color:var(--crit)}.n-ok small b{color:var(--ok)}
.reg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.reg .campo{margin:0}.reg .larga{grid-column:1/-1}
.reg input,.reg select{min-height:48px}
.sl{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linha)}
.sl .d{font-family:var(--f-mono);font-size:13px;color:var(--mudo)}.sl .h{font-weight:600}.sl .pc{grid-column:2/-1}
.sl button{background:none;border:0;color:var(--mudo);cursor:pointer;min-width:44px;min-height:44px;font-size:18px}
.esc{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}.esc input{padding:8px;border:1px solid var(--linha);border-radius:8px;min-height:44px}
@media(max-width:760px){.reg{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:repeat(2,1fr);gap:10px}.tile b{font-size:20px}.tile{padding:12px 14px}.par{height:130px}.barras{gap:2px}.mes{font-size:9px;min-width:0}.par i{width:44%}.cx{padding:18px 16px}}
@media(max-width:760px){
  #app,#app.min{grid-template-columns:minmax(0,1fr)}
  #sb,#sb.min{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:10;transform:translateX(-100%);transition:transform .2s}
  #sb.aberto{transform:none}
  #sb.min .lb,#sb.min .grp,#sb.min .logo{display:revert}
  #tg{display:none}
  #top-menu{display:block}
  header.bar{padding:12px 16px}
  main{padding:18px 16px}
  .duas{grid-template-columns:1fr}
  .quem{display:none}
  #rodape{padding:10px 16px 24px}
}
</style>
</head>
<body>

<div id="gate">
  <form class="gcx" id="gform" autocomplete="on" novalidate>
    <div class="marca">Reembolso</div>
    <h1 id="gtit">Entrar</h1>
    <p class="sub" id="gsub">Acesso restrito.</p>
    <label class="campo"><span>E-mail</span><input id="gem" type="email" autocomplete="username" inputmode="email" autocapitalize="none" required></label>
    <label class="campo so-conv" hidden><span>Código de primeiro acesso</span><input id="gcod" autocomplete="off" autocapitalize="characters" maxlength="9" placeholder="XXXX-XXXX"></label>
    <label class="campo"><span id="gpw-l">Senha</span><input id="gpw" type="password" autocomplete="current-password" required></label>
    <label class="campo so-conv" hidden><span>Repita a senha</span><input id="gpw2" type="password" autocomplete="new-password"></label>
    <button class="bt" id="gbtn" type="submit">Entrar</button>
    <p class="err" id="gerr" role="alert"></p>
    <button class="lk" id="glk" type="button">Primeiro acesso (tenho um código)</button>
  </form>
</div>

<div id="app" hidden>
  <aside id="sb">
    <div class="topo">
      <div class="logo">Reembolso<small id="sb-sub">Plano de saúde</small></div>
      <button id="tg" title="Recolher menu" aria-label="Recolher menu"></button>
    </div>
    <nav id="sb-nav" aria-label="Menu"></nav>
    <div class="pe" id="sb-pe"></div>
  </aside>
  <div id="veu" hidden></div>
  <div class="col">
    <header class="bar">
      <button id="top-menu" aria-label="Abrir menu"></button>
      <h2 id="top-tit"></h2>
      <div class="quem"><b id="eu-nome"></b><span id="eu-perfil"></span></div>
    </header>
    <main id="view"></main>
    <div id="rodape"><span id="upd"></span><div id="aviso" class="aviso"></div></div>
  </div>
</div>

<script src="validacao.js"></script>
<script>
window.__API_URL = "https://script.google.com/macros/s/AKfycbzI9RukpWjjUxzs15vbvtbapxLYGiTGhOjzQdsiVD0GMZAkEtefYFzenKsA5geZN7UqLw/exec";   // URL do App da Web publicado (…/exec). Única constante a trocar no deploy.

(function(){
  var API = window.__API_URL, TK = 'ma-reemb-t', MENU_K = 'ma-reemb-menu';
  var $ = function(s, r){ return (r||document).querySelector(s); }, $$ = function(s, r){ return [].slice.call((r||document).querySelectorAll(s)); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var S = { t:null, u:null, areas:[], v:null, M:null, ciclo:null, prof:null };
  var brl = function(n){ return (n===''||n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); };
  var num = function(x){ var n = parseFloat(x); return isNaN(n) ? null : n; };
  var dataBR = function(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m ? m[3]+'/'+m[2]+'/'+m[1] : '—'; };
  var digitos = function(s){ return String(s||'').replace(/\D/g,''); };
  async function gunzipB64(b64){
    var u = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
    return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  }
  async function carregarDados(){
    var o = await api('dados');
    if(!o.ok) throw new Error(o.msg || 'Não foi possível carregar os dados.');
    S.u = o.usuario || S.u; S.M = await gunzipB64(o.gz);
    var d = new Date(S.M.gerado);
    $('#upd').textContent = 'Atualizado em ' + d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  }

  // ------------------------------------------------------------ API e senha
  async function api(a, corpo){
    if(!API) throw new Error('config');
    var r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({a:a, t:S.t}, corpo||{})) });
    if(!r.ok) throw new Error('rede '+r.status);
    var o = await r.json();
    if(o.erro==='sessao' && a!=='entrar' && a!=='convite'){ sairJa(o.msg); throw new Error(o.msg); }
    return o;
  }
  async function chave(email, senha){
    var s = await api('sal', { email: email });
    var te = new TextEncoder(), k = await crypto.subtle.importKey('raw', te.encode(senha), 'PBKDF2', false, ['deriveBits']);
    var b = new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt: te.encode('amil|'+s.sal), iterations: s.iter }, k, 256));
    var x=''; for(var i=0;i<b.length;i++) x+=String.fromCharCode(b[i]); return btoa(x);
  }
  var msgErro = function(x, padrao){
    var m = String(x && x.message || '');
    if(m==='config') return 'O app ainda não está ligado ao servidor (falta a URL da API).';
    return /rede|fetch|network/i.test(m) ? 'Sem conexão com o servidor. Tente de novo.' : (m || padrao);
  };

  // ------------------------------------------------------------ capa
  function gate(){
    var f = $('#gform'), err = $('#gerr'), btn = $('#gbtn'), modo = 'entrar';
    function trocar(m){
      modo = m; $$('.so-conv', f).forEach(function(e){ e.hidden = m!=='convite'; });
      $('#gpw-l').textContent = m==='convite' ? 'Crie sua senha' : 'Senha';
      $('#gpw').autocomplete = m==='convite' ? 'new-password' : 'current-password';
      $('#gtit').textContent = m==='convite' ? 'Primeiro acesso' : 'Entrar';
      btn.textContent = m==='convite' ? 'Criar senha e entrar' : 'Entrar';
      $('#glk').textContent = m==='convite' ? 'Já tenho senha' : 'Primeiro acesso (tenho um código)';
      err.textContent = '';
    }
    $('#glk').addEventListener('click', function(){ trocar(modo==='entrar'?'convite':'entrar'); });
    f.addEventListener('submit', async function(e){
      e.preventDefault(); err.textContent = '';
      var email = $('#gem').value.trim().toLowerCase(), senha = $('#gpw').value;
      if(!(window.crypto && crypto.subtle && window.DecompressionStream)){ err.textContent = 'Este navegador não permite entrar com segurança. Use Chrome, Edge ou Safari atualizados.'; return; }
      if(!email || !senha){ err.textContent = 'Preencha e-mail e senha.'; return; }
      if(modo==='convite'){
        if(senha.length < 8){ err.textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return; }
        if(senha !== $('#gpw2').value){ err.textContent = 'As duas senhas não são iguais.'; return; }
      }
      btn.disabled = true; var t0 = btn.textContent; btn.textContent = 'Entrando…';
      try{
        var h = await chave(email, senha);
        var o = modo==='convite' ? await api('convite', { email: email, codigo: $('#gcod').value, h: h }) : await api('entrar', { email: email, h: h });
        if(!o.ok) throw new Error(o.msg || 'Não foi possível entrar.');
        S.t = o.t; try{ sessionStorage.setItem(TK, o.t); }catch(_){}
        S.u = o.usuario; S.areas = o.areas;
        $('#gpw').value = $('#gpw2').value = '';
        await abrirApp();
      }catch(x){ err.textContent = msgErro(x, 'Não foi possível entrar.'); btn.disabled = false; btn.textContent = t0; }
    });
    var t = null; try{ t = sessionStorage.getItem(TK); }catch(_){}
    if(t && API){
      S.t = t; btn.disabled = true; btn.textContent = 'Abrindo…';
      api('eu').then(function(o){ if(!o.ok) throw 0; S.u = o.usuario; S.areas = o.areas; return abrirApp(); })
        .catch(function(){ S.t = null; try{ sessionStorage.removeItem(TK); }catch(_){} btn.disabled = false; btn.textContent = 'Entrar'; });
    } else $('#gem').focus();
  }
  function sairJa(msg){
    try{ sessionStorage.removeItem(TK); }catch(_){}
    if(msg) try{ sessionStorage.setItem('ma-reemb-msg', msg); }catch(_){}
    location.hash = ''; location.reload();
  }
  async function sair(){
    var t = S.t; S.t = null;
    try{ if(t && API) await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({a:'sair', t:t}) }); }catch(_){}
    sairJa();
  }

  // ------------------------------------------------------------ ícones
  var ICO = {

  // ------------------------------------------------------------ painel (§9)
  var DIA = 864e5;
  function dias(a, b){ var x = Date.parse(a), y = Date.parse(b); return isNaN(x)||isNaN(y) ? null : Math.round((y-x)/DIA); }
  function mediana(v){ if(!v.length) return null; v = v.slice().sort(function(a,b){ return a-b; }); var m = v.length>>1; return v.length%2 ? v[m] : Math.round((v[m-1]+v[m])/2); }
  /** Cada lançamento cai em no máximo uma causa, na ordem de prioridade abaixo. */
  function calcPainel(L, P){
    var r = { fat:0, reemb:0, falta:0, nunca:0, meses:{}, prazos:{}, todosA:[], todosB:[],
      causas:[ { id:'falta',  t:'Falta lançar o valor recebido', d:'Tem data de reembolso e valor em branco. O dinheiro provavelmente já entrou; falta registrar.', itens:[] },
               { id:'nunca',  t:'Nunca entrou na Amil', d:'Sem data de entrada. Está parado aqui, não lá. Normalmente falta nota fiscal ou lista de frequência.', itens:[] },
               { id:'glosa',  t:'Glosado por tabela própria', d:'Reembolso abaixo de 50% do valor pago.', itens:[] },
               { id:'espera', t:'Na Amil, sem reembolso ainda', d:'Já protocolado, sem data de reembolso.', itens:[] } ] };
    var causa = {}; r.causas.forEach(function(c){ causa[c.id] = c; });
    L.forEach(function(l){
      var v = num(l.valor)||0, rv = num(l.vReembolsado), m = r.meses[l.ciclo] = r.meses[l.ciclo] || { fat:0, reemb:0, a:[], b:[] };
      r.fat += v; m.fat += v; if(rv!==null){ r.reemb += rv; m.reemb += rv; }
      var a = dias(l.dtPagamento, l.dtEntrada), b = dias(l.dtEntrada, l.dtReembolso);
      if(a!==null && a>=0){ m.a.push(a); r.todosA.push(a); } if(b!==null && b>=0){ m.b.push(b); r.todosB.push(b); }
      var c = null;
      if(!l.dtEntrada){ c = 'nunca'; r.nunca += v; }
      else if(l.status==='Pagamento Confirmado' && l.dtReembolso && rv===null){ c = 'falta'; r.falta += v; }
      else if(rv!==null && v>0 && rv/v < .5) c = 'glosa';
      else if(!l.dtReembolso && rv===null) c = 'espera';
      if(c) causa[c].itens.push({ ciclo:l.ciclo, quem:(P[l.profId]||{}).apelido||l.profId, valor:v, dif:rv===null ? v : v-rv });
    });
    r.causas.forEach(function(c){ c.total = c.itens.reduce(function(s,i){ return s + (c.id==='glosa' ? i.dif : i.valor); }, 0);
      c.itens.sort(function(x,y){ return y.ciclo.localeCompare(x.ciclo) || x.quem.localeCompare(y.quem,'pt-BR'); }); });
    r.causas.sort(function(x,y){ return y.total - x.total; });
    r.saldo = r.fat - r.reemb; r.provavel = r.saldo - r.falta;
    return r;
  }
  function telaPainel(){
    var L = S.M.lancamentos;
    if(!L.length) return '<div class="cx"><h3>Painel</h3><p class="sub">Nenhum lançamento ainda.</p></div>';
    var c = calcPainel(L, mapaProf());
    var nFalta = c.causas.filter(function(x){ return x.id==='falta'; })[0].itens.length, nNunca = c.causas.filter(function(x){ return x.id==='nunca'; })[0].itens.length;
    var tile = function(t, v, s, at){ return '<div class="tile'+(at?' at':'')+'"><span>'+t+'</span><b>'+brl(v)+'</b><small>'+s+'</small></div>'; };
    var tiles = '<div class="tiles">'+
      tile('Faturado no ano', c.fat, L.length+' lançamentos')+
      tile('Reembolsado', c.reemb, c.fat ? Math.round(100*c.reemb/c.fat)+'% do faturado registrado' : '')+
      tile('Saldo aparente', c.saldo, 'faturado − reembolsado registrado')+
      tile('Falta lançar', c.falta, nFalta+' linhas pagas sem valor registrado', c.falta>0)+
      tile('Saldo provável', c.provavel, 'saldo aparente − falta lançar')+

  // ------------------------------------------------------------ download e envio de arquivos (Fase 5)
  function baixarB64(b64, nome){
    var u = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); }), url = URL.createObjectURL(new Blob([u], { type:'application/pdf' }));
    var a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  var PARALELO = 2, PEDACO = 262144, ativos = 0, espera = [], pendentes = 0;      // 256 KB: múltiplo exigido pelo Drive no envio retomável
  function mostrarFila(){ var f = $('#fila'); if(!f) return; f.hidden = pendentes===0; f.textContent = pendentes===1 ? 'Enviando 1 arquivo. Não feche esta página até terminar.' : 'Enviando '+pendentes+' arquivos. Não feche esta página até terminar.'; }
  function naFila(fn){
    pendentes++; mostrarFila();
    return new Promise(function(ok, erro){ espera.push({ fn:fn, ok:ok, erro:erro }); puxar(); }).finally(function(){ pendentes--; mostrarFila(); });
  }
  function puxar(){ while(ativos < PARALELO && espera.length){ var t = espera.shift(); ativos++; t.fn().then(t.ok, t.erro).finally(function(){ ativos--; puxar(); }); } }
  window.addEventListener('beforeunload', function(e){ if(pendentes > 0){ e.preventDefault(); e.returnValue = ''; } });
  function lerB64(blob){
    return new Promise(function(ok, erro){ var r = new FileReader(); r.onload = function(){ ok(String(r.result).split(',')[1] || ''); }; r.onerror = function(){ erro(r.error); }; r.readAsDataURL(blob); });
  }
  async function subir(tipo, f, extra, avancou){
    var mime = f.type || '';
    var s = await api('iniciarUpload', Object.assign({ tipo:tipo, nome:f.name, mime:mime, tamanho:f.size }, extra)); if(!s.ok) throw new Error(s.msg);
    for(var ini = 0; ini < f.size; ){
      var pedaco = f.slice(ini, Math.min(ini + PEDACO, f.size)), b64 = await lerB64(pedaco);
      var r = await api('enviarPedaco', { token:s.token, b64:b64, inicio:ini }); if(!r.ok) throw new Error(r.msg);
      ini += pedaco.size; avancou(pedaco.size);
      if(r.pronto) return r;
    }
    throw new Error('O envio terminou sem confirmação.');
  }
  async function enviarLote(tipo, files, extra, barra, info){
    files = files.filter(function(f){ return f.size > 0; });
    if(!files.length){ info.className = 'msg er'; info.textContent = 'Arquivo vazio.'; return; }
    var total = files.reduce(function(a, f){ return a + f.size; }, 0), feito = 0, falhas = [], certos = 0;
    barra.hidden = false; barra.firstChild.style.width = '4%'; info.className = 'msg'; info.textContent = 'Enviando…';
    await Promise.all(files.map(function(f){
      return naFila(function(){ return subir(tipo, f, extra, function(n){ feito += n; barra.firstChild.style.width = Math.max(4, feito/total*100)+'%'; }); })
        .then(function(){ certos++; }, function(e){ falhas.push(f.name+' ('+msgErro(e, 'falhou')+')'); });
    }));
    barra.hidden = true;
    if(certos){ try{ await carregarDados(); }catch(_){} }
    if(falhas.length){ info.className = 'msg er'; info.textContent = 'Não subiu: '+falhas.join('; ')+'. Tente de novo.'; if(certos) ir('envio'); return; }
    ir('envio'); var m = $('#info-'+tipo); if(m){ m.className = 'msg ok'; m.textContent = (files.length===1 ? 'Recebido.' : files.length+' arquivos recebidos.')+' Obrigado.'; }
  }

      campo('end','Endereço onde atende',p.endereco||'','maxlength="240"')+
      '<div class="duas">'+campo('vh','Valor/hora (R$)',p.valorHora||'','inputmode="decimal"')+campo('act','Validade do atestado de capacidade técnica',p.actValidade||'','type="date"')+'</div>'+
      '<label class="campo"><span>Alerta de cadastro (nota interna; apague quando resolver)</span><textarea id="pf-alerta" rows="2" maxlength="300">'+esc(p.alerta||'')+'</textarea></label>'+
      '<label class="tgl"><input type="checkbox" id="pf-ativo"'+(novo||bool(p.ativo)?' checked':'')+'> Ativa</label>'+
      '<button class="bt" id="pf-salvar">Salvar</button> <button class="bt cl" id="pf-fechar">Fechar</button>'+
      (!novo && S.u.admin ? ' <button class="bt cl" id="pf-conv">Gerar convite de acesso</button>' : '')+
      '<span class="msg" id="pf-msg"></span><div id="pf-convbox"></div></div>';
  }
  telaProfissionais.depois = function(){
    $$('.pi').forEach(function(b){ b.onclick = function(){ S.prof = b.dataset.id; ir('profissionais'); var f = $('#pr-form'); if(f) f.scrollIntoView({block:'start'}); }; });
    $('#pr-novo').onclick = function(){ S.prof = 'novo'; ir('profissionais'); };
    if(!S.prof) return;
    $('#pf-fechar').onclick = function(){ S.prof = null; ir('profissionais'); };
    $('#pf-salvar').onclick = async function(){
      var b = this, mg = $('#pf-msg'), v = function(i){ return $('#pf-'+i).value; };
      var atual = S.prof==='novo' ? null : S.M.profissionais.filter(function(x){ return x.id===S.prof; })[0];
      var p = { id: atual ? atual.id : '', nome:v('nome'), apelido:v('apelido'), terapia:v('terapia'), papel:v('papel'), conselho:v('conselho'),
        registro:v('registro'), docFiscal:v('doc'), email:v('email'), endereco:v('end'), valorHora:v('vh'), actValidade:v('act'),
        alerta:v('alerta'), ativo:$('#pf-ativo').checked };
      b.disabled = true; mg.className = 'msg'; mg.textContent = 'Salvando…';
      try{
        var o = await api('salvarProfissional', { p:p }); if(!o.ok) throw new Error(o.msg);
        var i = -1; S.M.profissionais.forEach(function(x, k){ if(x.id===o.profissional.id) i = k; });
        if(i>=0) S.M.profissionais[i] = o.profissional; else S.M.profissionais.push(o.profissional);
        S.prof = o.profissional.id; ir('profissionais');
        var m = $('#pf-msg'); m.className = 'msg ok'; m.textContent = 'Salvo. ' + (o.avisos||[]).join(' ');
      }catch(x){ mg.className = 'msg er'; mg.textContent = msgErro(x, 'Não foi possível salvar.'); b.disabled = false; }
    };
    var cv = $('#pf-conv');
    if(cv) cv.onclick = async function(){
      var mg = $('#pf-msg'); mg.className = 'msg'; mg.textContent = 'Gerando…';
      try{
        var o = await api('convidarProfissional', { profId:S.prof }); if(!o.ok) throw new Error(o.msg);
        mg.textContent = '';
        var txt = 'Seu acesso ao app de reembolso: abra mandacap.com.br/reembolso, toque em "Primeiro acesso", use o e-mail '+o.email+' e o código '+o.codigo+' (vale até '+o.validade+') e crie a sua senha.';
        $('#pf-convbox').innerHTML = '<div class="conv">Código de primeiro acesso: <span class="cod">'+esc(o.codigo)+'</span><br><span class="sub">Vale até '+esc(o.validade)+'.</span><div style="margin-top:8px"><button class="bt cl" id="cv-cp">Copiar mensagem</button></div></div>';
        $('#cv-cp').onclick = function(){ try{ navigator.clipboard.writeText(txt); this.textContent = 'Copiado'; }catch(_){} };
      }catch(x){ mg.className = 'msg er'; mg.textContent = msgErro(x, 'Não foi possível gerar.'); }
    };
  };

  // ------------------------------------------------------------ perfil
  function telaPerfil(){
    var u = S.u;
    return '<div class="cx"><h3>'+esc(u.nome || u.email)+'</h3><p class="sub">'+esc(u.email)+' · último acesso '+esc(u.ultimoAcesso||'—')+'</p></div>'+
      '<div class="cx"><h3>Trocar senha</h3><p class="sub">Mínimo de 8 caracteres.</p>'+
      '<label class="campo"><span>Senha atual</span><input type="password" id="pf-s0" autocomplete="current-password"></label>'+
      '<div class="duas"><label class="campo"><span>Senha nova</span><input type="password" id="pf-s1" autocomplete="new-password"></label>'+
      '<label class="campo"><span>Repetir a senha nova</span><input type="password" id="pf-s2" autocomplete="new-password"></label></div>'+
      '<button class="bt" id="pf-senha">Trocar senha</button><span class="msg" id="pf-smsg"></span></div>';
  }
  telaPerfil.depois = function(){
    $('#pf-senha').onclick = async function(){
      var b = this, mg = $('#pf-smsg'), s0 = $('#pf-s0').value, s1 = $('#pf-s1').value, s2 = $('#pf-s2').value; mg.className = 'msg er';
      if(!s0){ mg.textContent = 'Digite a senha atual.'; return; }
      if(s1.length < 8){ mg.textContent = 'A senha nova precisa ter pelo menos 8 caracteres.'; return; }
      if(s1 !== s2){ mg.textContent = 'As senhas novas não são iguais.'; return; }
      b.disabled = true; mg.className = 'msg'; mg.textContent = 'Trocando…';
      try{
        var o = await api('trocarSenha', { hAtual: await chave(S.u.email, s0), hNova: await chave(S.u.email, s1) });
        if(!o.ok) throw new Error(o.msg);
        mg.className = 'msg ok'; mg.textContent = 'Senha trocada.'; $('#pf-s0').value = $('#pf-s1').value = $('#pf-s2').value = '';
      }catch(x){ mg.className = 'msg er'; mg.textContent = msgErro(x, 'Não foi possível trocar.'); }
      b.disabled = false;
    };
  };

  // ------------------------------------------------------------ PWA e partida
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js', { scope:'./' }).catch(function(){}); }catch(_){} }
  try{ var m0 = sessionStorage.getItem('ma-reemb-msg'); if(m0){ sessionStorage.removeItem('ma-reemb-msg'); $('#gerr').textContent = m0; } }catch(_){}
  if(!API) $('#gerr').textContent = 'O app ainda não está ligado ao servidor (falta a URL da API).';
  gate();
})();
</script>
</body>
</html>

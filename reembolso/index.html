<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base href="/reembolso/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B2550">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Reembolso</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --az:#0B63B1; --azesc:#0B2550; --azesc2:#0F2E61; --verde:#3FB6AE; --ouro:#F3BC49;
  --creme:#F3EBD9; --tinta:#1D2433; --mudo:#5D6576; --linha:#E2E6EC; --fundo:#F4F6FA; --branco:#fff;
  /* semânticos: só significam estado, nunca acento */
  --ok:#1E8E5A; --atencao:#B7791F; --crit:#B4232A; --crit-bg:#FBE6E4; --ok-bg:#E3F4EB;
  --f-corpo:'Barlow',system-ui,sans-serif; --f-marca:'Montserrat','Barlow',sans-serif; --f-mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-corpo);color:var(--tinta);background:var(--fundo);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- capa ---------- */
#gate{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--azesc)}
.gcx{width:100%;max-width:400px;background:var(--branco);border-radius:14px;padding:32px 28px;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.marca{font-family:var(--f-marca);font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--az)}
.gcx h1{margin:6px 0 4px;font-size:26px;font-weight:700;color:var(--azesc)}
.gcx p.sub{margin:0 0 22px;color:var(--mudo);font-size:15px}
.campo{display:block;margin-bottom:14px}
.campo>span{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mudo);margin-bottom:5px}
.campo input,.campo textarea,.campo select{width:100%;padding:12px 13px;border:1px solid var(--linha);border-radius:8px;background:var(--branco);font-size:16px}
.campo input:focus,.bt:focus-visible,.it:focus-visible,.lk:focus-visible{outline:2px solid var(--az);outline-offset:1px}
.bt{font-family:var(--f-marca);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:var(--az);color:#fff;border:0;border-radius:8px;padding:13px 20px;cursor:pointer;min-height:44px}
.bt:disabled{opacity:.6;cursor:default}
.bt.cl{background:transparent;color:var(--az);border:1px solid var(--az)}
#gbtn{width:100%;margin-top:4px}
.lk{background:none;border:0;color:var(--az);cursor:pointer;padding:12px 0 0;font-size:14px;text-decoration:underline}
.err{color:var(--crit);font-size:14px;min-height:20px;margin:10px 0 0}
.msg{font-size:14px;margin-left:12px}.msg.ok{color:var(--ok)}.msg.er{color:var(--crit)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.col{min-width:0}
#sb{background:var(--azesc);color:var(--creme);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s}
#sb .topo{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 14px}
#sb .logo{font-family:var(--f-marca);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#fff}
#sb .logo small{display:block;font-family:var(--f-mono);font-weight:400;letter-spacing:.06em;text-transform:none;color:#9FB2D4;font-size:11px;margin-top:3px}
#sb-nav{flex:1;overflow:auto;padding:6px 10px}
.grp{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7F95BD;padding:16px 10px 6px}
.it{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--creme);padding:11px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:15px;font-weight:500;min-height:44px}
.it:hover{background:var(--azesc2)}
.it.on{background:var(--azesc2);box-shadow:inset 3px 0 0 var(--ouro);color:#fff}
#sb .pe{border-top:1px solid #163A73;padding:10px}
#sb.min{width:64px}#app.min{grid-template-columns:64px minmax(0,1fr)}
#sb.min .lb,#sb.min .grp,#sb.min .logo{display:none}
#tg{background:none;border:0;color:#9FB2D4;cursor:pointer;padding:6px;border-radius:6px}
header.bar{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--branco);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:5}
header.bar h2{margin:0;font-size:20px;font-weight:700;color:var(--azesc);flex:1}
#top-menu{display:none;background:none;border:0;padding:8px;margin-left:-8px;cursor:pointer;color:var(--azesc)}
.quem{font-size:14px;color:var(--mudo);text-align:right}.quem b{display:block;color:var(--tinta);font-weight:600}
main{padding:28px;max-width:1200px;width:100%}
.cx{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:22px 24px;margin-bottom:18px}
.cx h3{margin:0 0 4px;font-size:18px;color:var(--azesc)}
.cx p.sub{margin:0 0 14px;color:var(--mudo);font-size:15px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--creme);color:var(--azesc)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#rodape{padding:10px 28px 24px;color:var(--mudo);font-family:var(--f-mono);font-size:12px}
#rodape .aviso{color:var(--atencao)}
#veu{position:fixed;inset:0;background:rgba(11,37,80,.5);z-index:9}

.chip{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:99px;margin:2px 4px 2px 0;background:#FBF1DC;color:var(--atencao)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.tb select{padding:10px 12px;border:1px solid var(--linha);border-radius:8px;background:#fff;min-height:44px}
.tb .gap{flex:1}
.pl{display:grid;gap:10px}
.pl button.pi{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;width:100%;background:var(--branco);border:1px solid var(--linha);border-radius:10px;padding:12px 16px;cursor:pointer}
.pl button.pi:hover,.pl button.pi.on{border-color:var(--az)}
.pl .nm{font-weight:600;color:var(--azesc)}.pl .nm small{font-weight:400;color:var(--mudo)}
.pl .pc{grid-column:1/-1}
.tw{overflow-x:auto;border:1px solid var(--linha);border-radius:10px;background:var(--branco)}
table.tb2{border-collapse:collapse;width:100%;min-width:760px;font-size:14.5px}
.tb2 th{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mudo);text-align:left;padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tb2 td{padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tb2 tr:last-child td{border-bottom:0}
.tb2 .n{text-align:right}.tb2 tfoot td{font-weight:700;background:var(--fundo)}
.resumo{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:14px}.resumo b{display:block;font-size:22px;color:var(--azesc)}
.resumo span{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mudo)}
.conv{background:var(--creme);border-radius:10px;padding:14px 16px;margin-top:14px}.conv .cod{font-family:var(--f-mono);font-size:22px;letter-spacing:.12em}
.tgl{display:flex;gap:8px;align-items:center;margin:4px 0 14px}.tgl input{width:20px;height:20px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.tile{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:16px 18px}
.tile span{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mudo)}
.tile b{display:block;font-size:26px;color:var(--azesc);margin:4px 0 2px;font-weight:700}
.tile small{color:var(--mudo);font-size:13px}
.tile.at{border-color:var(--atencao)}.tile.at b{color:var(--atencao)}
.barras{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end}
.mes{text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--mudo)}
.par{height:170px;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--linha)}
.par i{display:block;width:42%;max-width:22px;border-radius:3px 3px 0 0;min-height:1px}
.par .f{background:var(--azesc)}.par .r{background:#8DB4DB}
.leg{display:flex;gap:18px;font-size:13px;color:var(--mudo);margin-top:12px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.causa{border-top:1px solid var(--linha);padding:12px 0}.causa:first-of-type{border-top:0}
.causa summary{cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 14px;list-style:none;min-height:44px;align-content:center}
.causa summary::-webkit-details-marker{display:none}
.causa .ct{font-weight:600;color:var(--azesc)}.causa .cv{font-weight:700;text-align:right}
.causa .cd{grid-column:1/-1;color:var(--mudo);font-size:14px}
.causa ul{margin:8px 0 0;padding:0;list-style:none;font-size:14.5px}.causa li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--linha)}
.ban{border-left:4px solid var(--atencao);background:#FBF1DC;border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:15px}
.ban.crit{border-color:var(--crit);background:var(--crit-bg)}.ban.ok{border-color:var(--ok);background:var(--ok-bg)}
.gc{min-width:104px}.gc b{font-weight:600}.gc small{display:block;color:var(--mudo);font-size:12px}
.bar{height:8px;background:var(--linha);border-radius:4px;overflow:hidden;margin:4px 0 2px}.bar i{display:block;height:100%}
.n-ok .bar i{background:var(--ok)}.n-atencao .bar i{background:var(--atencao)}.n-critico .bar i{background:var(--crit)}
.n-atencao small b{color:var(--atencao)}.n-critico small b{color:var(--crit)}.n-ok small b{color:var(--ok)}
.reg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.reg .campo{margin:0}.reg .larga{grid-column:1/-1}
.reg input,.reg select{min-height:48px}
.sl{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linha)}
.sl .d{font-family:var(--f-mono);font-size:13px;color:var(--mudo)}.sl .h{font-weight:600}.sl .pc{grid-column:2/-1}
.sl button{background:none;border:0;color:var(--mudo);cursor:pointer;min-width:44px;min-height:44px;font-size:18px}
.esc{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}.esc input{padding:8px;border:1px solid var(--linha);border-radius:8px;min-height:44px}
a.bt{display:inline-block;text-decoration:none;text-align:center;line-height:1.2}a.solta{color:var(--az);font-size:14px}
.det-in.l{text-align:left}.det-in.l .gp h4{text-align:left}
/* grade mensal de horários */
.semanas{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-top:10px}
.sem h4{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;color:var(--azesc);font-size:14px}.sem h4 small{font-weight:400;color:var(--mudo)}.sem h4 span{font-family:var(--f-mono);font-size:12px}
.grade{border-collapse:collapse;width:100%;table-layout:fixed;font-size:10px}
.grade th.h{width:30px;font-family:var(--f-mono);font-weight:400;font-size:9.5px;color:var(--mudo);text-align:right;padding-right:4px;line-height:1}
.grade th.dia{background:var(--fundo);border:1px solid var(--linha);padding:2px 0;line-height:1.1}.grade th.dia small{display:block;color:var(--mudo);font-weight:400}.grade th.dia b{font-size:11px;color:var(--azesc)}
.grade th.dia.fim{background:#DADFE6}.grade th.dia.hoje{box-shadow:inset 0 -2px 0 var(--az)}.grade th.dia[role=button]{cursor:pointer}
.grade td.c{height:14px;padding:0;border:1px solid #EEF1F5;text-align:center;color:#fff;font-size:9px;line-height:14px;background:var(--branco)}
.grade td.c.fim{background:#EDEFF3;border-color:#E2E5EB}.grade td.c.clic{cursor:pointer}.grade td.c.clic:hover{outline:2px solid var(--az);outline-offset:-2px}
.grade td.c.mar{background:repeating-linear-gradient(45deg,#0B63B1 0 3px,#8DB4DB 3px 6px)!important}
.grade td.tt{border-top:1px solid var(--linha);text-align:center;font-family:var(--f-mono);font-size:10px;color:var(--azesc);padding:2px 0}.grade td.tt.fim{background:#EDEFF3}
.grade-tot{text-align:right;margin:10px 0 0;color:var(--mudo)}.grade-tot b{color:var(--azesc)}
/* tabela do ciclo, sem rolagem lateral */
table.tb2.tcic{table-layout:auto;min-width:0;width:100%}.tcic th,.tcic td{white-space:normal;padding:8px 6px;font-size:13.5px;vertical-align:middle}.tcic td.ck,.tcic th.ck{width:30px;padding:8px 4px}
.tcic td.sdo{color:var(--atencao);font-weight:700}.tcic td.zero{color:var(--mudo)}.tcic .dab{color:var(--atencao);font-weight:600}
.barra-sel{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#EAF2FB;border:1px solid var(--az);border-radius:10px;padding:10px 14px;margin:6px 0 10px;position:sticky;top:60px;z-index:4}.barra-sel #sel-txt{flex:1;font-weight:600;color:var(--azesc);min-width:160px}
@media(max-width:760px){
  .tcic thead{display:none}.tcic,.tcic tbody{display:block}.tcic tr.clic{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px 8px;border:1px solid var(--linha);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--branco);position:relative}
  .tcic tr.gh{display:block}.tcic tr.gh td{display:block}
  .tcic td{display:block;text-align:left!important;padding:2px 0;font-size:13px}.tcic td.ck{position:absolute;top:6px;right:8px;width:auto}
  .tcic td.nm{grid-column:1/-1;font-size:15px}.tcic td[data-r]::before{content:attr(data-r);display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mudo)}
  .semanas{grid-template-columns:1fr}
}
/* tabela de profissionais */
.tprof th.l,.tprof td.l{text-align:left}.tprof th.n,.tprof td.n{text-align:right}.tprof td{padding:9px 12px}
.tprof th.ord{cursor:pointer;user-select:none}.tprof th.ord:hover,.tprof th.ord.on{color:var(--azesc)}
.tb .busca{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--linha);border-radius:8px;min-height:44px;background:#fff}
.tb2 tr.sub-tot td{background:var(--fundo);font-weight:600;color:var(--mudo);font-size:13px}
/* tabelas centralizadas, linha expansível, agenda, gráficos */
.tb2.ctr th,.tb2.ctr td{text-align:center;vertical-align:middle}.tb2.ctr td .ac{margin:0 auto;text-align:center}
.tb2 tr.aberto>td{background:#EAF2FB;font-weight:600}.tb2 tr.det>td{background:var(--fundo);padding:12px 8px;white-space:normal}
.det-in .tb2{background:var(--branco)}.det-in .tb2 td{font-weight:400}
.pt{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.m.tt{color:#fff;font-weight:600}
.cal.marcar .cd{min-height:84px}.cd.sel2{background:#DCEBFA;border-color:var(--az);box-shadow:inset 0 0 0 2px var(--az)}.cd.fut{opacity:.4;cursor:not-allowed}.cd.tem b{color:var(--azesc)}
.x2{background:none;border:0;color:var(--mudo);font-size:22px;cursor:pointer;min-width:44px;min-height:44px}.x2:hover{color:var(--crit)}
.graf{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;align-items:end;margin-top:8px}
.gcol{text-align:center;font-family:var(--f-mono);font-size:10.5px;color:var(--mudo)}.gcol b{display:block;color:var(--tinta);font-weight:500;min-height:14px;font-size:10.5px}
.gbar{height:170px;display:flex;flex-direction:column-reverse;border-bottom:1px solid var(--linha);justify-content:flex-start}.gbar i{display:block;width:70%;margin:0 auto}
.hbs{display:grid;gap:8px}.hb{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:14px}.hb>div{background:var(--linha);border-radius:4px;height:14px;overflow:hidden}.hb i{display:block;height:100%}.hb b{text-align:right;font-weight:600}
.esc-p{margin:6px 0}.esc-p small{color:var(--mudo);margin-left:6px}.lk3.mini{font-size:12px;min-height:26px;padding:0}
@media(max-width:760px){.hb{grid-template-columns:100px 1fr 56px}.gbar{height:130px}.cal.marcar .cd{min-height:64px}}
/* módulos: lista de ações, tabelas clicáveis, abas, calendário, gaveta */
.chip.neutro{background:var(--fundo);color:var(--mudo);border:1px solid var(--linha)}
.ac{font-size:13.5px;white-space:normal;color:var(--mudo)}.ac.crit{color:var(--crit);font-weight:600}.ac.at{color:var(--atencao);font-weight:600}.ac.ok{color:var(--ok)}
.tb2 tr.clic{cursor:pointer}.tb2 tr.clic:hover td{background:#F0F5FB}.tb2 tr.gh td{background:var(--creme);color:var(--azesc);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px}
.tb2 td small{color:var(--mudo)}.tb2 td .ac{display:block;max-width:340px}
.lst{margin:8px 0 0;padding:0;list-style:none;font-size:14.5px}.lst li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed var(--linha)}
.lst li .ac{flex:1;text-align:right}.lst li .v{font-weight:600;min-width:96px;text-align:right}
.lk3{background:none;border:0;padding:6px 0;color:var(--az);cursor:pointer;text-align:left;font-size:14.5px;min-height:36px}.lk3:hover{text-decoration:underline}
.lk2{font-size:13px;margin-left:8px}
.gh2{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 16px;margin:22px 0 10px}.gh2 h3{margin:0;color:var(--azesc)}.gh2 h3 small{color:var(--mudo);font-weight:400}.gh2 span{color:var(--mudo);font-size:13.5px}
.pl .stats{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--mudo)}.pl .stats b{color:var(--tinta)}
.abas{display:flex;gap:4px;overflow-x:auto;margin:6px 0 12px;border-bottom:1px solid var(--linha)}
.aba{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font-weight:600;color:var(--mudo);cursor:pointer;white-space:nowrap;min-height:44px}.aba.on{color:var(--azesc);border-color:var(--az)}
.cab-prof h3{font-size:22px}
.gp{margin-bottom:14px}.gp h4,.cx h4{margin:16px 0 4px;color:var(--azesc);font-size:15px}
.up-card{background:var(--fundo);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.ups{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.bt.peq{padding:8px 12px;min-height:38px;font-size:12px}.bt.perigo{color:var(--crit);border-color:var(--crit)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cdh{font-family:var(--f-mono);font-size:11px;color:var(--mudo);text-align:center;padding:4px 0}
.cd{background:var(--branco);border:1px solid var(--linha);border-radius:8px;min-height:74px;padding:4px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:12px;overflow:hidden}
.cd.vazio{border:0;background:none;cursor:default}.cd b{font-size:12px;color:var(--mudo);font-weight:600}.cd.hoje{border-color:var(--az);box-shadow:inset 0 0 0 1px var(--az)}.cd.sel{background:#EAF2FB}
.m{font-style:normal;border-radius:4px;padding:1px 4px;font-size:10.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.m.s{background:#DCE8F7;color:var(--azesc)}.m.p{background:#EFE6CC;color:#6B5316}.m.a{background:#DDF1EF;color:#1D6B65}.m.r{background:#E7E3F3;color:#4A3F7A}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mudo);margin-top:10px}.cal-leg .m{display:inline-block;width:14px;height:10px;padding:0;margin-right:5px}
#cal-det{margin-top:12px}
.dr{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end}.dr-bg{position:absolute;inset:0;background:rgba(11,37,80,.45)}
.dr-in{position:relative;background:var(--branco);width:min(560px,100%);height:100%;overflow-y:auto;padding:22px 24px 32px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.dr-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}.dr-top h3{margin:0 0 4px;color:var(--azesc)}.dr .x{background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:var(--mudo);min-width:44px;min-height:44px}
.dr-bt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;position:sticky;bottom:0;background:var(--branco);padding:12px 0 0}
@media(max-width:760px){.dr-in{padding:18px 16px 28px}.cd{min-height:58px;font-size:11px}.m{font-size:9.5px;padding:1px 2px}.tb select{max-width:100%}}
@media(max-width:760px){.reg{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:repeat(2,1fr);gap:10px}.tile b{font-size:20px}.tile{padding:12px 14px}.par{height:130px}.barras{gap:2px}.mes{font-size:9px;min-width:0}.par i{width:44%}.cx{padding:18px 16px}}
@media(max-width:760px){
  #app,#app.min{grid-template-columns:minmax(0,1fr)}
  #sb,#sb.min{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:10;transform:translateX(-100%);transition:transform .2s}
  #sb.aberto{transform:none}
  #sb.min .lb,#sb.min .grp,#sb.min .logo{display:revert}
  #tg{display:none}
  #top-menu{display:block}
  header.bar{padding:12px 16px}
  main{padding:18px 16px}
  .duas{grid-template-columns:1fr}
  .quem{display:none}
  #rodape{padding:10px 16px 24px}
}
</style>
</head>
<body>

<div id="gate">
  <form class="gcx" id="gform" autocomplete="on" novalidate>
    <div class="marca">Reembolso</div>
    <h1 id="gtit">Entrar</h1>
    <p class="sub" id="gsub">Acesso restrito.</p>
    <label class="campo"><span>E-mail</span><input id="gem" type="email" autocomplete="username" inputmode="email" autocapitalize="none" required></label>
    <label class="campo so-conv" hidden><span>Código de primeiro acesso</span><input id="gcod" autocomplete="off" autocapitalize="characters" maxlength="9" placeholder="XXXX-XXXX"></label>
    <label class="campo"><span id="gpw-l">Senha</span><input id="gpw" type="password" autocomplete="current-password" required></label>
    <label class="campo so-conv" hidden><span>Repita a senha</span><input id="gpw2" type="password" autocomplete="new-password"></label>
    <button class="bt" id="gbtn" type="submit">Entrar</button>
    <p class="err" id="gerr" role="alert"></p>
    <button class="lk" id="glk" type="button">Primeiro acesso (tenho um código)</button>
  </form>
</div>

<div id="app" hidden>
  <aside id="sb">
    <div class="topo">
      <div class="logo">Reembolso<small id="sb-sub">Plano de saúde</small></div>
      <button id="tg" title="Recolher menu" aria-label="Recolher menu"></button>
    </div>
    <nav id="sb-nav" aria-label="Menu"></nav>
    <div class="pe" id="sb-pe"></div>
  </aside>
  <div id="veu" hidden></div>
  <div class="col">
    <header class="bar">
      <button id="top-menu" aria-label="Abrir menu"></button>
      <h2 id="top-tit"></h2>
      <div class="quem"><b id="eu-nome"></b><span id="eu-perfil"></span></div>
    </header>
    <main id="view"></main>
    <div id="rodape"><span id="upd"></span><div id="aviso" class="aviso"></div></div>
  </div>
</div>

<script src="validacao.js"></script>
<script src="dominio.js"></script>
<script src="painel.js"></script>
<script src="ciclo.js"></script>
<script src="profissionais.js"></script>
<script src="documentos.js"></script>
<script src="sessoes.js"></script>
<script>
window.__API_URL = "https://script.google.com/macros/s/AKfycbzI9RukpWjjUxzs15vbvtbapxLYGiTGhOjzQdsiVD0GMZAkEtefYFzenKsA5geZN7UqLw/exec";   // URL do App da Web publicado (…/exec). Única constante a trocar no deploy.

(function(){
  var API = window.__API_URL, TK = 'ma-reemb-t', MENU_K = 'ma-reemb-menu';
  var $ = function(s, r){ return (r||document).querySelector(s); }, $$ = function(s, r){ return [].slice.call((r||document).querySelectorAll(s)); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var S = { t:null, u:null, areas:[], v:null, M:null, ciclo:null, prof:null };
  var brl = function(n){ return (n===''||n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); };
  var num = function(x){ var n = parseFloat(x); return isNaN(n) ? null : n; };
  var dataBR = function(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m ? m[3]+'/'+m[2]+'/'+m[1] : '—'; };
  var digitos = function(s){ return String(s||'').replace(/\D/g,''); };
  async function gunzipB64(b64){
    var u = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
    return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  }
  async function carregarDados(){
    var o = await api('dados');
    if(!o.ok) throw new Error(o.msg || 'Não foi possível carregar os dados.');
    S.u = o.usuario || S.u; S.M = await gunzipB64(o.gz);
    var d = new Date(S.M.gerado);
    $('#upd').textContent = 'Atualizado em ' + d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  }

  // ------------------------------------------------------------ API e senha
  async function api(a, corpo){
    if(!API) throw new Error('config');
    var r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({a:a, t:S.t}, corpo||{})) });
    if(!r.ok) throw new Error('rede '+r.status);
    var o = await r.json();
    if(o.erro==='sessao' && a!=='entrar' && a!=='convite'){ sairJa(o.msg); throw new Error(o.msg); }
    return o;
  }
  async function chave(email, senha){
    var s = await api('sal', { email: email });
    var te = new TextEncoder(), k = await crypto.subtle.importKey('raw', te.encode(senha), 'PBKDF2', false, ['deriveBits']);
    var b = new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt: te.encode('amil|'+s.sal), iterations: s.iter }, k, 256));
    var x=''; for(var i=0;i<b.length;i++) x+=String.fromCharCode(b[i]); return btoa(x);
  }
  var msgErro = function(x, padrao){
    var m = String(x && x.message || '');
    if(m==='config') return 'O app ainda não está ligado ao servidor (falta a URL da API).';
    return /rede|fetch|network/i.test(m) ? 'Sem conexão com o servidor. Tente de novo.' : (m || padrao);
  };

  // ------------------------------------------------------------ capa
  function gate(){
    var f = $('#gform'), err = $('#gerr'), btn = $('#gbtn'), modo = 'entrar';
    function trocar(m){
      modo = m; $$('.so-conv', f).forEach(function(e){ e.hidden = m!=='convite'; });
      $('#gpw-l').textContent = m==='convite' ? 'Crie sua senha' : 'Senha';
      $('#gpw').autocomplete = m==='convite' ? 'new-password' : 'current-password';
      $('#gtit').textContent = m==='convite' ? 'Primeiro acesso' : 'Entrar';
      btn.textContent = m==='convite' ? 'Criar senha e entrar' : 'Entrar';
      $('#glk').textContent = m==='convite' ? 'Já tenho senha' : 'Primeiro acesso (tenho um código)';
      err.textContent = '';
    }
    $('#glk').addEventListener('click', function(){ trocar(modo==='entrar'?'convite':'entrar'); });
    f.addEventListener('submit', async function(e){
      e.preventDefault(); err.textContent = '';
      var email = $('#gem').value.trim().toLowerCase(), senha = $('#gpw').value;
      if(!(window.crypto && crypto.subtle && window.DecompressionStream)){ err.textContent = 'Este navegador não permite entrar com segurança. Use Chrome, Edge ou Safari atualizados.'; return; }
      if(!email || !senha){ err.textContent = 'Preencha e-mail e senha.'; return; }
      if(modo==='convite'){
        if(senha.length < 8){ err.textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return; }
        if(senha !== $('#gpw2').value){ err.textContent = 'As duas senhas não são iguais.'; return; }
      }
      btn.disabled = true; var t0 = btn.textContent; btn.textContent = 'Entrando…';
      try{
        var h = await chave(email, senha);
        var o = modo==='convite' ? await api('convite', { email: email, codigo: $('#gcod').value, h: h }) : await api('entrar', { email: email, h: h });
        if(!o.ok) throw new Error(o.msg || 'Não foi possível entrar.');
        S.t = o.t; try{ sessionStorage.setItem(TK, o.t); }catch(_){}
        S.u = o.usuario; S.areas = o.areas;
        $('#gpw').value = $('#gpw2').value = '';
        await abrirApp();
      }catch(x){ err.textContent = msgErro(x, 'Não foi possível entrar.'); btn.disabled = false; btn.textContent = t0; }
    });
    var t = null; try{ t = sessionStorage.getItem(TK); }catch(_){}
    if(t && API){
      S.t = t; btn.disabled = true; btn.textContent = 'Abrindo…';
      api('eu').then(function(o){ if(!o.ok) throw 0; S.u = o.usuario; S.areas = o.areas; return abrirApp(); })
        .catch(function(){ S.t = null; try{ sessionStorage.removeItem(TK); }catch(_){} btn.disabled = false; btn.textContent = 'Entrar'; });
    } else $('#gem').focus();
  }
  function sairJa(msg){
    try{ sessionStorage.removeItem(TK); }catch(_){}
    if(msg) try{ sessionStorage.setItem('ma-reemb-msg', msg); }catch(_){}
    location.hash = ''; location.reload();
  }
  async function sair(){
    var t = S.t; S.t = null;
    try{ if(t && API) await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({a:'sair', t:t}) }); }catch(_){}
    sairJa();
  }

  // ------------------------------------------------------------ ícones
  var ICO = {
    painel:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
    ciclo:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    sessoes:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    profissionais:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    documentos:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
    envio:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>',
    perfil:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    sair:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
    menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
    recolher:'<path d="m15 18-6-6 6-6"/>'
  };
  var ic = function(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(ICO[k]||'')+'</svg>'; };

  // ------------------------------------------------------------ abrir o app
  var estreito = function(){ return window.matchMedia('(max-width:760px)').matches; };
  async function abrirApp(){
    await carregarDados();
    $('#gate').remove(); $('#app').hidden = false;
    $('#top-menu').innerHTML = ic('menu'); $('#tg').innerHTML = ic('recolher');
    montarMenu();
    $('#eu-nome').textContent = S.u.apelido || S.u.nome || S.u.email;
    $('#eu-perfil').textContent = ({familia:'Família', profissional:'Profissional', leitura:'Leitura'})[S.u.perfil] || '';
    var h = (location.hash||'').slice(1);
    ir(h==='perfil' || S.areas.some(function(a){ return a.id===h; }) ? h : (S.areas[0] ? S.areas[0].id : 'perfil'));
  }
  function montarMenu(){
    var nav = $('#sb-nav'), h = '', gr = '';
    S.areas.forEach(function(a){
      if(a.grupo !== gr){ gr = a.grupo; h += '<div class="grp">'+esc(gr)+'</div>'; }
      h += '<button class="it" data-v="'+esc(a.id)+'" title="'+esc(a.nome)+'">'+ic(a.id)+'<span class="lb">'+esc(a.nome)+'</span></button>';
    });
    nav.innerHTML = h;
    $('#sb-pe').innerHTML =
      '<button class="it" data-v="perfil" title="Meu perfil">'+ic('perfil')+'<span class="lb">Meu perfil</span></button>'+
      '<button class="it" id="sair" title="Sair">'+ic('sair')+'<span class="lb">Sair</span></button>';
    $$('.it[data-v]').forEach(function(b){ b.addEventListener('click', function(){ ir(b.dataset.v); if(estreito()) abrirMenu(false); }); });
    $('#sair').onclick = sair;
    var sb = $('#sb'), salvo = null; try{ salvo = localStorage.getItem(MENU_K); }catch(_){}
    if(salvo==='1' && !estreito()){ sb.classList.add('min'); $('#app').classList.add('min'); }
    $('#tg').onclick = function(){
      var on = sb.classList.toggle('min'); $('#app').classList.toggle('min', on);
      try{ localStorage.setItem(MENU_K, on?'1':'0'); }catch(_){}
    };
    $('#top-menu').onclick = function(){ abrirMenu(!sb.classList.contains('aberto')); };
    $('#veu').onclick = function(){ abrirMenu(false); };
  }
  function abrirMenu(on){ $('#sb').classList.toggle('aberto', on); $('#veu').hidden = !on; }

  // ------------------------------------------------------------ telas (cada bloco renderiza isolado)
  var TELAS = { perfil: telaPerfil, sessoes: telaSessoes, envio: telaEnvio };      // painel, ciclo, profissionais e documentos vêm dos módulos .js
  var bool = function(x){ return x===true || String(x).toLowerCase()==='true' ? 1 : 0; };
  var mapaProf = function(){ var m = {}; S.M.profissionais.forEach(function(p){ m[p.id] = p; }); return m; };
  var TERAPIA_NOME = { aba:'ABA', fono:'Fonoaudiologia', to:'Terapia ocupacional', psicomot:'Psicomotricidade' };
  function placeholder(id){
    var a = S.areas.filter(function(x){ return x.id===id; })[0] || { nome:id };
    return '<div class="cx"><h3>'+esc(a.nome)+'</h3><p class="sub">Esta tela ainda não está disponível.</p></div>';
  }
  function ir(v){
    S.v = v; var rod = $('#aviso'); rod.textContent = '';
    $$('.it[data-v]').forEach(function(b){ b.classList.toggle('on', b.dataset.v===v); });
    var a = S.areas.filter(function(x){ return x.id===v; })[0];
    $('#top-tit').textContent = v==='perfil' ? 'Meu perfil' : (a ? a.nome : '');
    var el = $('#view');
    try{ el.innerHTML = TELAS[v] ? TELAS[v]() : placeholder(v); if(TELAS[v] && TELAS[v].depois) TELAS[v].depois(); }
    catch(x){ console.error(x); el.innerHTML = ''; rod.textContent = 'Este bloco não carregou ('+v+'). Recarregue a página.'; }
    try{ history.replaceState(null, '', '#'+v); }catch(_){}
    window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------ sessões e validação do laudo (§6)
  var V = window.Validacao, DS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  var NIVEL = { ok:'ok', atencao:'atenção', critico:'crítico' };
  var hojeISO = function(){ var d = new Date(), z = function(n){ return (n<10?'0':'')+n; }; return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); };
  var hh = function(n){ return n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}); };
  function celGrade(c, sub){
    return '<div class="gc n-'+c.nivel+'"><b>'+hh(c.usado)+' / '+hh(c.teto)+' h</b><div class="bar"><i style="width:'+Math.min(100, Math.round(100*c.razao))+'%"></i></div><small><b>'+Math.round(100*c.razao)+'% · '+NIVEL[c.nivel]+'</b>'+(sub?' · '+sub:'')+'</small></div>';
  }
  function telaSessoes(){
    var fam = S.u.perfil==='familia', mp = mapaProf(), H = S.M.horasSemana, hoje = hojeISO();
    var ciclo = S.sesMes || hoje.slice(0,7), SS = S.M.sessoes;
    var meses = {}; meses[hoje.slice(0,7)] = 1; SS.forEach(function(s){ meses[s.data.slice(0,7)] = 1; }); meses[ciclo] = 1;
    var lista = Object.keys(meses).sort().reverse();
    var ativos = S.M.profissionais.filter(function(p){ return bool(p.ativo); });
    var u0 = S.ult || {};
    var optProf = ativos.map(function(p){ return '<option value="'+esc(p.id)+'"'+(u0.profId===p.id?' selected':'')+'>'+esc(p.apelido||p.nome)+'</option>'; }).join('');
    var optLocal = V.LOCAIS.map(function(l){ return '<option'+(u0.local===l?' selected':'')+'>'+esc(l)+'</option>'; }).join('');
    var form = '<div class="cx"><h3>Registrar sessão</h3><p class="sub">As horas são calculadas pelo servidor.</p><div class="reg">'+
      '<label class="campo"><span>Data</span><input type="date" id="ss-data" value="'+hoje+'" max="'+hoje+'"></label>'+
      (ativos.length===1 && !fam ? '<input type="hidden" id="ss-prof" value="'+esc(ativos[0].id)+'">' : '<label class="campo"><span>Profissional</span><select id="ss-prof">'+optProf+'</select></label>')+
      '<label class="campo"><span>Local</span><select id="ss-local">'+optLocal+'</select></label>'+
      '<label class="campo"><span>Início</span><input type="time" id="ss-ini" value="'+esc(u0.horaIni||'')+'"></label>'+
      '<label class="campo"><span>Fim</span><input type="time" id="ss-fim" value="'+esc(u0.horaFim||'')+'"></label>'+
      '<label class="campo"><span>Horas</span><input id="ss-h" readonly value="—"></label>'+
      '<label class="campo larga"><span>Observação (opcional)</span><input id="ss-obs" maxlength="300"></label></div>'+
      '<div style="margin-top:14px"><button class="bt" id="ss-salvar">Registrar</button><span class="msg" id="ss-msg"></span></div></div>';

    var val = fam ? V.validar({ ciclo:ciclo, sessoes:SS, profs:mp, H:H, escola:S.M.escola }) : null;
    var alertas = val ? val.alertas : (function(){ var a = {}; SS.forEach(function(s){ var x = V.alertasDaSessao(s, null); if(x.length) a[s.id] = x; }); return a; })();
    var bans = '', grade = '';
    if(fam){
      var nCrit = 0; Object.keys(val.terapias).forEach(function(t){ var T = val.terapias[t]; T.janelas.concat([T.mes]).forEach(function(c){ if(c.nivel==='critico') nCrit++; }); });
      if(nCrit) bans += '<div class="ban crit"><b>'+nCrit+' limite'+(nCrit>1?'s':'')+' estourado'+(nCrit>1?'s':'')+' em '+esc(ciclo.slice(5)+'/'+ciclo.slice(0,4))+'.</b> Veja a grade abaixo: o teto vale por terapia e por janela, não pelo total.</div>';
      if(V.escolaVazia(S.M.escola)) bans += '<div class="ban"><b>Horário escolar não configurado.</b> Não consigo verificar se uma sessão cruza a escola. Preencha em Parâmetros, no fim da página.</div>';
      var semTer = ativos.filter(function(p){ return !p.terapia; });
      if(semTer.length) bans += '<div class="ban"><b>'+(semTer.length>1 ? semTer.length+' profissionais ativas sem terapia' : '1 profissional ativa sem terapia')+': '+esc(semTer.map(function(p){ return p.apelido||p.nome; }).join(', '))+'.</b> '+
        (val.fora.sessoes ? 'Neste mês são '+hh(val.fora.horas)+' h em '+val.fora.sessoes+(val.fora.sessoes>1?' sessões':' sessão')+' que ficam <b>fora da validação</b>. ' : 'As horas delas ficam fora da validação. ')+'Defina a terapia em Profissionais.</div>';
      var nomes = { aba:'ABA', fono:'Fonoaudiologia', to:'Terapia ocupacional', psicomot:'Psicomotricidade' };
      var cab = V.janelas(ciclo).map(function(j){ return '<th>Semana '+j.n+'<br><small>dias '+j.ini+'–'+j.fim+'</small></th>'; }).join('');
      var linhas = Object.keys(nomes).map(function(t){ var T = val.terapias[t];
        return '<tr><td><b>'+nomes[t]+'</b><br><small>'+H[t]+' h/semana</small></td>'+T.janelas.map(function(j){ return '<td>'+celGrade(j)+'</td>'; }).join('')+

        '<div class="tw"><table class="tb2" style="min-width:880px"><thead><tr><th>Terapia</th>'+cab+'<th>Mês<br><small>'+val.diasMes+' dias</small></th><th>Acumulado</th></tr></thead><tbody>'+linhas+'</tbody></table></div></div>';
    }
    var doMes = SS.filter(function(s){ return s.data.slice(0,7)===ciclo; }).sort(function(a,b){ return (b.data+b.horaIni).localeCompare(a.data+a.horaIni); });
    var tot = doMes.reduce(function(s,x){ return s + (num(x.horas)||0); }, 0);
    var itens = doMes.map(function(s){
      var p = mp[s.profId]||{}, d = s.data.slice(8)+'/'+s.data.slice(5,7), al = alertas[s.id]||[];
      return '<div class="sl"><span class="d">'+d+' · '+DS[V.diaSemana(s.data)].slice(0,3)+'</span><span><span class="h">'+esc(s.horaIni)+'–'+esc(s.horaFim)+'</span> · '+hh(num(s.horas)||0)+' h · '+esc(p.apelido||s.profId)+' · '+esc(s.local)+'</span>'+
        '<button data-del="'+esc(s.id)+'" aria-label="Excluir sessão" title="Excluir">×</button>'+(al.length ? '<span class="pc">'+al.map(function(a){ return '<span class="chip'+(a.nivel==='critico'?' crit':'')+'">'+esc(a.texto)+'</span>'; }).join('')+'</span>' : '')+'</div>';
    }).join('') || '<p class="sub">Nenhuma sessão neste mês.</p>';
    var cabLista = '<div class="cx"><h3>Sessões do mês</h3><div class="tb"><select id="ss-mes" aria-label="Mês">'+lista.map(function(c){ return '<option'+(c===ciclo?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select><span>'+doMes.length+' sessões · '+hh(tot)+' h</span></div>'+itens+'</div>';

    var param = '';
    if(fam){
      var esc7 = [1,2,3,4,5,6,0].map(function(d){ var e = (S.M.escola||{})[d]||{};
        return '<div class="esc"><span>'+DS[d]+'</span><input type="time" data-e="'+d+'i" value="'+esc(e.ini||'')+'" aria-label="'+DS[d]+' início"><input type="time" data-e="'+d+'f" value="'+esc(e.fim||'')+'" aria-label="'+DS[d]+' fim"></div>'; }).join('');
      param = '<details class="cx" id="ss-param"><summary style="cursor:pointer;font-weight:600;color:var(--azesc);min-height:44px">Parâmetros</summary>'+
        '<p class="sub">Horário em que o Pedro está na escola, por dia da semana. Deixe em branco os dias sem aula.</p>'+esc7+
        '<label class="campo" style="max-width:280px"><span>Psicomotricidade (h/semana)</span><select id="pm-h"><option value="2"'+(H.psicomot===2?' selected':'')+'>2 h (autos, ev. 1.6)</option><option value="1"'+(H.psicomot===1?' selected':'')+'>1 h (laudo 14/11/2025)</option></select></label>'+
        '<button class="bt" id="pm-salvar">Salvar parâmetros</button><span class="msg" id="pm-msg"></span></details>';
    }
    var cal = '<div class="cx"><h3>Calendário de '+esc(ciclo)+'</h3><p class="sub">Horas de sessão por dia. Toque num dia para ver as sessões e preencher a data do registro.</p>'+window.App.D.calendario(ciclo, window.App.D.ctx(), 'atend')+'</div>';
    return form + bans + grade + cal + cabLista + param;
  }
  telaSessoes.depois = function(){
    var calc = function(){ var h = V.horasDaSessao($('#ss-ini').value, $('#ss-fim').value); $('#ss-h').value = h===null ? '—' : hh(h)+' h'; };
    $('#ss-ini').oninput = $('#ss-fim').oninput = calc; calc();
    window.App.D.ligarCalendario(window.App.D.ctx(), function(d){ if(d <= hojeISO()){ $('#ss-data').value = d; } });
    $('#ss-mes').onchange = function(){ S.sesMes = this.value; ir('sessoes'); };
    $('#ss-salvar').onclick = async function(){
      var b = this, mg = $('#ss-msg'), s = { data:$('#ss-data').value, profId:$('#ss-prof').value, horaIni:$('#ss-ini').value, horaFim:$('#ss-fim').value, local:$('#ss-local').value, obs:$('#ss-obs').value };
      if(!s.profId){ mg.className = 'msg er'; mg.textContent = 'Escolha a profissional.'; return; }
      if(V.horasDaSessao(s.horaIni, s.horaFim)===null){ mg.className = 'msg er'; mg.textContent = 'Confira início e fim: o fim precisa ser depois do início.'; return; }
      b.disabled = true; mg.className = 'msg'; mg.textContent = 'Salvando…';
      try{
        var o = await api('salvarSessao', { s:s }); if(!o.ok) throw new Error(o.msg);
        S.M.sessoes = S.M.sessoes.filter(function(x){ return x.id!==o.sessao.id; }).concat([o.sessao]);
        S.ult = { profId:s.profId, local:s.local, horaIni:'', horaFim:'' }; S.sesMes = s.data.slice(0,7);
        var aviso = [], p = mapaProf()[s.profId]||{};
        if(S.u.perfil==='familia'){
          var al = V.alertasDaSessao(o.sessao, S.M.escola); al.forEach(function(a){ aviso.push(a.texto); });
          if(p.terapia){ var val = V.validar({ ciclo:s.data.slice(0,7), sessoes:S.M.sessoes, profs:mapaProf(), H:S.M.horasSemana, escola:S.M.escola }), T = val.terapias[p.terapia];
            var dia = +s.data.slice(8), j = T.janelas[dia<=7?0:dia<=14?1:dia<=21?2:3];
            if(j.nivel!=='ok') aviso.push('semana '+j.n+' de '+p.terapia.toUpperCase()+' em '+Math.round(100*j.razao)+'% do teto ('+NIVEL[j.nivel]+')');
            if(T.mes.nivel!=='ok') aviso.push('mês em '+Math.round(100*T.mes.razao)+'% do teto'); }
          else aviso.push('sem terapia cadastrada: fora da validação');
        }
        ir('sessoes'); var m = $('#ss-msg'); m.className = 'msg '+(aviso.length?'er':'ok'); m.textContent = 'Registrada ('+hh(num(o.sessao.horas)||0)+' h).'+(aviso.length?' Atenção: '+aviso.join('; ')+'.':'');
      }catch(x){ mg.className = 'msg er'; mg.textContent = msgErro(x, 'Não foi possível registrar.'); b.disabled = false; }
    };
    $$('[data-del]').forEach(function(b){ b.onclick = async function(){
      if(!confirm('Excluir esta sessão?')) return;
      try{ var o = await api('excluirSessao', { id:b.dataset.del }); if(!o.ok) throw new Error(o.msg);
        S.M.sessoes = S.M.sessoes.filter(function(x){ return x.id!==b.dataset.del; }); ir('sessoes'); }
      catch(x){ $('#aviso').textContent = msgErro(x, 'Não foi possível excluir.'); } }; });
    var pm = $('#pm-salvar');
    if(pm) pm.onclick = async function(){
      var mg = $('#pm-msg'), esc7 = {}; mg.className = 'msg'; mg.textContent = 'Salvando…';
      for(var d = 0; d <= 6; d++){ var i = $('[data-e="'+d+'i"]').value, f = $('[data-e="'+d+'f"]').value; if(i || f) esc7[d] = { ini:i, fim:f }; }
      try{ var o = await api('salvarConfig', { escola:esc7, psicomotHoras:+$('#pm-h').value }); if(!o.ok) throw new Error(o.msg);
        S.M.escola = o.escola; S.M.horasSemana = o.horasSemana; ir('sessoes'); $('#ss-param').open = true; var m = $('#pm-msg'); m.className = 'msg ok'; m.textContent = 'Salvo.'; }
      catch(x){ mg.className = 'msg er'; mg.textContent = msgErro(x, 'Não foi possível salvar.'); }

  // ------------------------------------------------------------ download e envio de arquivos (Fase 5)
  function baixarB64(b64, nome){
    var u = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); }), url = URL.createObjectURL(new Blob([u], { type:'application/pdf' }));
    var a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  var PARALELO = 2, PEDACO = 262144, ativos = 0, espera = [], pendentes = 0;      // 256 KB: múltiplo exigido pelo Drive no envio retomável
  function mostrarFila(){ var f = $('#fila'); if(!f) return; f.hidden = pendentes===0; f.textContent = pendentes===1 ? 'Enviando 1 arquivo. Não feche esta página até terminar.' : 'Enviando '+pendentes+' arquivos. Não feche esta página até terminar.'; }
  function naFila(fn){
    pendentes++; mostrarFila();
    return new Promise(function(ok, erro){ espera.push({ fn:fn, ok:ok, erro:erro }); puxar(); }).finally(function(){ pendentes--; mostrarFila(); });
  }
  function puxar(){ while(ativos < PARALELO && espera.length){ var t = espera.shift(); ativos++; t.fn().then(t.ok, t.erro).finally(function(){ ativos--; puxar(); }); } }
  window.addEventListener('beforeunload', function(e){ if(pendentes > 0){ e.preventDefault(); e.returnValue = ''; } });
  function lerB64(blob){
    return new Promise(function(ok, erro){ var r = new FileReader(); r.onload = function(){ ok(String(r.result).split(',')[1] || ''); }; r.onerror = function(){ erro(r.error); }; r.readAsDataURL(blob); });
  }
  async function subir(tipo, f, extra, avancou){
    var mime = f.type || '';
    var s = await api('iniciarUpload', Object.assign({ tipo:tipo, nome:f.name, mime:mime, tamanho:f.size }, extra)); if(!s.ok) throw new Error(s.msg);
    for(var ini = 0; ini < f.size; ){
      var pedaco = f.slice(ini, Math.min(ini + PEDACO, f.size)), b64 = await lerB64(pedaco);
      var r = await api('enviarPedaco', { token:s.token, b64:b64, inicio:ini }); if(!r.ok) throw new Error(r.msg);
      ini += pedaco.size; avancou(pedaco.size);
      if(r.pronto) return r;
    }
    throw new Error('O envio terminou sem confirmação.');
  }
  /** depois(): o que redesenhar ao terminar (recebe o texto de resultado e se deu certo). */
  async function enviarLote(tipo, files, extra, barra, info, depois){
    files = files.filter(function(f){ return f.size > 0; });
    if(!files.length){ info.className = 'msg er'; info.textContent = 'Arquivo vazio.'; return; }
    var total = files.reduce(function(a, f){ return a + f.size; }, 0), feito = 0, falhas = [], certos = 0;
    barra.hidden = false; barra.firstChild.style.width = '4%'; info.className = 'msg'; info.textContent = 'Enviando…';
    await Promise.all(files.map(function(f){
      return naFila(function(){ return subir(tipo, f, extra, function(n){ feito += n; barra.firstChild.style.width = Math.max(4, feito/total*100)+'%'; }); })
        .then(function(){ certos++; }, function(e){ falhas.push(f.name+' ('+msgErro(e, 'falhou')+')'); });
    }));
    barra.hidden = true;
    if(certos){ try{ await carregarDados(); }catch(_){} }
    var erro = falhas.length ? 'Não subiu: '+falhas.join('; ')+'. Tente de novo.' : '';
    var ok = !falhas.length ? (files.length===1 ? 'Recebido.' : files.length+' arquivos recebidos.')+' Obrigado.' : '';
    if(depois){ await depois(certos > 0); }
    var m = $('#info-'+tipo) || info; m.className = 'msg '+(erro?'er':'ok'); m.textContent = erro || ok;
  }

  // ------------------------------------------------------------ envio (visão da profissional)
  function telaEnvio(){
    var meu = S.M.profissionais[0];

    var SS = S.M.sessoes, hoje = hojeISO(), uni = {}; SS.forEach(function(s){ uni[s.data.slice(0,7)] = 1; }); S.M.lancamentos.forEach(function(l){ uni[l.ciclo] = 1; }); uni[hoje.slice(0,7)] = 1;
    var ciclos = Object.keys(uni).sort().reverse();
    if(!S.envMes || ciclos.indexOf(S.envMes)<0) S.envMes = ciclos.filter(function(c){ return SS.some(function(s){ return s.data.slice(0,7)===c; }); })[0] || ciclos[0];
    var doMes = SS.filter(function(s){ return s.data.slice(0,7)===S.envMes; }).sort(function(a,b){ return (a.data+a.horaIni).localeCompare(b.data+b.horaIni); });

    var lan = S.M.lancamentos.filter(function(l){ return l.ciclo===S.envMes; });
    var tem = function(k){ return lan.some(function(l){ return l[k]==='Sim'; }); };
    var chip = function(ok){ return ok ? '<span class="chip ok">Recebida</span>' : '<span class="chip">Falta enviar</span>'; };
    var linhas = doMes.map(function(s){ return '<tr><td>'+dataBR(s.data)+'</td><td>'+esc(s.horaIni)+' às '+esc(s.horaFim)+'</td><td class="n">'+hh(num(s.horas)||0)+'</td></tr>'; }).join('');
    var up = function(tipo, rot, ok, dica){ return '<div class="cx"><h3>'+rot+' '+(ok===null?'':chip(ok))+'</h3><p class="sub">'+dica+'</p>'+
      '<button class="bt cl" data-up="'+tipo+'">Escolher arquivo</button><span class="msg" id="info-'+tipo+'"></span><div class="bar" id="barra-'+tipo+'" hidden><i style="width:4%;background:var(--az)"></i></div></div>'; };
    return '<div class="tb"><select id="env-mes" aria-label="Mês">'+ciclos.map(function(c){ return '<option'+(c===S.envMes?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select></div>'+
      '<div id="fila" class="ban" hidden></div>'+
      '<div class="cx"><h3>1. Confira as sessões</h3><p class="sub">'+doMes.length+' sessões · '+hh(tot)+' h em '+esc(S.envMes)+'. Se algo estiver errado, avise a família antes de assinar.</p>'+
      (doMes.length ? '<div class="tw"><table class="tb2" style="min-width:0"><thead><tr><th>Data</th><th>Horário</th><th class="n">Horas</th></tr></thead><tbody>'+linhas+'</tbody></table></div>' : '')+'</div>'+
      '<div class="cx"><h3>2. Baixe a lista e assine</h3><p class="sub">A lista já vem preenchida. Assine (a assinatura gov.br vale) e guarde o PDF.</p>'+
      '<button class="bt" id="env-baixar"'+(doMes.length?'':' disabled')+'>Baixar lista de frequência</button><span class="msg" id="env-msg"></span></div>'+
      up('lista', '3. Envie a lista assinada', tem('freq'), 'PDF, JPG ou PNG, até 15 MB.')+
      up('nf', '4. Envie a nota fiscal', tem('nf'), 'PDF, JPG ou PNG, até 15 MB.')+
      up('ato', 'Atestado de capacidade técnica', null, 'Só quando a família pedir. Validade cadastrada: '+(meu.actValidade ? dataBR(meu.actValidade) : 'não informada')+'.');
  }
  telaEnvio.depois = function(){
    var meu = S.M.profissionais[0]; if(!meu) return;
    $('#env-mes').onchange = function(){ S.envMes = this.value; ir('envio'); };

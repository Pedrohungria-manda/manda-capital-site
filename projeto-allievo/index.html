<style>
html,body{margin:0}
body{font-family:'Outfit','Segoe UI',system-ui,sans-serif;background:#F2F3F5;color:#252525;-webkit-font-smoothing:antialiased}
.gate{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.gate .half{position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 34px}
.gate .gl{background:radial-gradient(600px 400px at 20% 10%,rgba(122,90,248,.30),transparent 60%),linear-gradient(165deg,#0B1430,#1B2C66);color:#fff;overflow:hidden}
.gate .gl svg.wm{position:absolute;left:-60px;top:8%;width:520px;opacity:.10}
.gate .gr{background:#F4F1EA;color:#575757;overflow:hidden}
.gate .gr svg.mwm{position:absolute;right:-40px;top:10%;width:460px;opacity:.07}
.gcap{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.gl .gcap{color:#A0B5D2}
.gr .gcap{text-align:right;color:#8a8a86}
.gcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));background:#fff;padding:36px 34px 22px;box-shadow:0 30px 80px rgba(11,20,48,.30);border-radius:20px}
.glogo{display:flex;align-items:center;justify-content:center;gap:14px}
.glogo svg{width:54px;height:34px}
.glogo span{font:400 30px 'Libre Baskerville',Georgia,serif;color:#203060}
.gx{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#A8A9A4}
.gx:before,.gx:after{content:"";flex:1;height:1px;background:#E2E2E2}
.gmanda{display:flex;align-items:center;justify-content:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.16em;color:#10283A}
.gcard h1{font:600 20px/1.3 'Poppins','Segoe UI',sans-serif;color:#203060;text-align:center;margin:22px 0 18px}
.gcard label{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6F89B0;margin-bottom:6px}
.gcard input{width:100%;box-sizing:border-box;border:1px solid #E4E8F0;background:#F7F8FB;padding:13px 15px;font:inherit;font-size:15px;border-radius:12px}
.gcard input:focus{outline:2px solid #A0B5D2;border-color:#203060}
.gcard button{width:100%;margin-top:12px;border:0;background:linear-gradient(90deg,#203060,#2448C8);color:#fff;padding:13px;font:inherit;font-weight:600;font-size:15px;border-radius:12px;cursor:pointer;box-shadow:0 8px 20px rgba(36,72,200,.3)}
.gcard button:disabled{opacity:.6}
.gerr{min-height:20px;font-size:12.5px;color:#9E3A38;margin-top:8px;text-align:center}
.gfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid #ECECEC;padding-top:12px;margin-top:6px;font-size:10.5px;color:#A8A9A4}
@media (max-width:700px){.gate{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.gate .half{padding:16px 18px}.gr .gcap{text-align:left}.gcard{padding:26px 22px 18px}}
</style>

<script>
(function(){
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
  async function unlock(pw){
    const P=JSON.parse(document.getElementById('payload').textContent), te=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
    const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(txt);
  }
  function boot(o){
    document.getElementById('gate').remove();
    const w=document.createElement('div'); w.innerHTML=o.html; while(w.firstChild) document.body.appendChild(w.firstChild);
    const s=document.createElement('script'); s.textContent=o.js; document.body.appendChild(s);
  }
  const f=document.getElementById('gform'),btn=document.getElementById('gbtn'),err=document.getElementById('gerr'),pw=document.getElementById('gpw');
  async function tryPw(p,silent){ btn.disabled=true; btn.textContent='Abrindo…'; err.textContent='';
    try{ const o=await unlock(p); try{sessionStorage.setItem('allievo-k',p)}catch(e){} boot(o); }
    catch(e){ btn.disabled=false; btn.textContent='Entrar'; if(!silent){ err.textContent=(window.crypto&&crypto.subtle)?'Senha incorreta. Tente novamente.':'Este navegador não abre o conteúdo com segurança. Use Chrome, Edge ou Safari atualizados.'; pw.select(); } } }
  f.addEventListener('submit',e=>{e.preventDefault(); tryPw(norm(pw.value));});
  let k=null; try{k=sessionStorage.getItem('allievo-k')}catch(e){} if(k) tryPw(k,true); else pw.focus();
})();
</script>

(function(){
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const I=document.getElementById('intro');if(!I)return;const $=s=>I.querySelector(s);let done=false;
const word=$('#word'); 'Allievo'.split('').forEach(c=>{const s=document.createElement('span');s.textContent=c;word.appendChild(s)});
const lines=[...document.querySelectorAll('#lines line')];
const C={x:1098,y:470}; // centro aproximado do símbolo
let anims=[],rate=1;

/* poeira de luz ao fundo */
const cv=$('#dust'),cx=cv.getContext('2d');let P=[],W,H,raf;
function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;P=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,v:Math.random()*.25+.05,a:Math.random()*.6+.1}))}
function dust(){cx.clearRect(0,0,W,H);P.forEach(p=>{p.y-=p.v*devicePixelRatio;if(p.y<0)p.y=H;cx.beginPath();cx.arc(p.x,p.y,p.r*devicePixelRatio,0,7);cx.fillStyle=`rgba(160,181,210,${p.a})`;cx.fill()});raf=requestAnimationFrame(dust)}
addEventListener('resize',rs);rs();if(!reduce)dust();

function A(el,kf,o){const a=el.animate(kf,{fill:'both',easing:'cubic-bezier(.22,1,.36,1)',...o});a.playbackRate=rate;anims.push(a);return a}

function play(){
  anims.forEach(a=>a.cancel());anims=[];
  if(reduce){end();return}
  const T=0;
  /* 1 · as seis linhas vêm girando de fora e se desenham */
  lines.forEach((l,i)=>{
    const len=Math.hypot(l.x2.baseVal.value-l.x1.baseVal.value,l.y2.baseVal.value-l.y1.baseVal.value);
    l.style.strokeDasharray=len;
    const ang=(i/lines.length)*360+40, dist=520;
    const dx=Math.cos(ang*Math.PI/180)*dist, dy=Math.sin(ang*Math.PI/180)*dist;
    const mx=(l.x1.baseVal.value+l.x2.baseVal.value)/2,my=(l.y1.baseVal.value+l.y2.baseVal.value)/2;
    l.style.transformOrigin=`${mx}px ${my}px`; l.style.transformBox='view-box';
    A(l,[{transform:`translate(${dx}px,${dy}px) rotate(${i%2?-300:300}deg) scale(.3)`,opacity:0,strokeDashoffset:len},{opacity:1,offset:.35},{transform:'translate(0,0) rotate(0) scale(1)',opacity:1,strokeDashoffset:0}],{duration:1500,delay:T+i*90});
  });
  /* o símbolo inteiro dá um giro e assenta */
  const g=$('#lines'); g.style.transformOrigin=`${C.x}px ${C.y}px`; g.style.transformBox='view-box';
  A(g,[{transform:'rotate(-120deg) scale(.82)'},{transform:'rotate(8deg) scale(1.04)',offset:.75},{transform:'rotate(0) scale(1)'}],{duration:2100,delay:T});
  /* órbitas */
  A($('#o1'),[{opacity:0,transform:'scale(.6) rotate(0deg)'},{opacity:1,offset:.3},{opacity:.0,transform:'scale(1.05) rotate(220deg)'}],{duration:3800,delay:T+200,easing:'ease-out'});
  A($('#o2'),[{opacity:0,transform:'scale(.7) rotate(0deg)'},{opacity:.8,offset:.4},{opacity:0,transform:'scale(1.1) rotate(-160deg)'}],{duration:4200,delay:T+300,easing:'ease-out'});
  /* 2 · clarão e reflexo passando no símbolo */
  A($('#flash'),[{opacity:0},{opacity:1},{opacity:0}],{duration:900,delay:T+1850,easing:'ease-out'});
  /* brilho só durante a formação; no fim o símbolo fica idêntico à logo (sem halo) */
  A(g,[{filter:'drop-shadow(0 0 12px rgba(160,181,210,.55))'},{filter:'drop-shadow(0 0 12px rgba(160,181,210,.55))',offset:.5},{filter:'drop-shadow(0 0 20px rgba(160,181,210,.8))',offset:.6},{filter:'drop-shadow(0 0 0px rgba(160,181,210,0))'}],{duration:3200,delay:T,easing:'ease-out'});
  /* 3 · o nome se forma, letra a letra */
  [...word.children].forEach((s,i)=>A(s,[{opacity:0,transform:'translateY(.45em)',filter:'blur(8px)'},{opacity:1,transform:'translateY(0)',filter:'blur(0)'}],{duration:900,delay:T+2350+i*70}));
  A($('#sub'),[{opacity:0,letterSpacing:'1.4em'},{opacity:1,letterSpacing:'.62em'}],{duration:1100,delay:T+2950});
  /* 4 · assinatura Manda Capital */
  A($('#rule'),[{width:'0'},{width:'min(46vmin,360px)'}],{duration:900,delay:T+3500});
  A($('#by'),[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:700,delay:T+3750});
  document.querySelectorAll('#by path').forEach((p,i)=>A(p,[{strokeDashoffset:640},{strokeDashoffset:0}],{duration:1200,delay:T+3800+i*150,easing:'ease-in-out'}));
  /* 5 · transição para a capa com senha */
  A($('.wrap'),[{transform:'scale(1)',opacity:1},{transform:'scale(1)',opacity:1,offset:.6},{transform:'scale(1.06)',opacity:0}],{duration:1800,delay:T+5900,easing:'ease-in'});
  A(I,[{opacity:1},{opacity:0}],{duration:900,delay:T+6700,easing:'ease-in-out'}).finished.then(end,()=>{});
}
function end(){if(done)return;done=true;cancelAnimationFrame(raf);I.remove();const p=document.getElementById('gpw');p&&p.focus();}
function skip(){if(done)return;anims.forEach(a=>a.pause());I.animate([{opacity:getComputedStyle(I).opacity},{opacity:0}],{duration:450,fill:'forwards'}).finished.then(end);}
I.addEventListener('click',skip);addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Enter')skip()},{once:true});

<script>
(function(){
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
  async function unlock(pw){
    const P=JSON.parse(document.getElementById('payload').textContent), te=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
    const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(txt);
  }
  function boot(o){
    document.getElementById('gate').remove();
    const w=document.createElement('div'); w.innerHTML=o.html; while(w.firstChild) document.body.appendChild(w.firstChild);
    const s=document.createElement('script'); s.textContent=o.js; document.body.appendChild(s);
  }
  const f=document.getElementById('gform'),btn=document.getElementById('gbtn'),err=document.getElementById('gerr'),pw=document.getElementById('gpw');
  async function tryPw(p,silent){ btn.disabled=true; btn.textContent='Abrindo…'; err.textContent='';
    try{ const o=await unlock(p); try{sessionStorage.setItem('allievo-k',p)}catch(e){} boot(o); }
    catch(e){ btn.disabled=false; btn.textContent='Entrar'; if(!silent){ err.textContent=(window.crypto&&crypto.subtle)?'Senha incorreta. Tente novamente.':'Este navegador não abre o conteúdo com segurança. Use Chrome, Edge ou Safari atualizados.'; pw.select(); } } }
  f.addEventListener('submit',e=>{e.preventDefault(); tryPw(norm(pw.value));});
  let k=null; try{k=sessionStorage.getItem('allievo-k')}catch(e){} if(k) tryPw(k,true); else if(!document.getElementById('intro')) pw.focus();
})();
</script>
